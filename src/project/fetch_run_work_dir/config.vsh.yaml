name: fetch_run_work_dir
namespace: project
description: Fetches a task execution directory from an S3 bucket and sync the input data.
arguments:
  - type: string
    name: --input
    required: true
    direction: input
    example: s3://openproblems-work/work/65/369e661a583488755685199c87fadf
    description: The S3 path to the task execution directory to fetch.
  - type: file
    name: --output
    required: true
    direction: output
    description: Output directory containing the fetched task execution files.
  - type: file
    name: --aws_credentials
    required: true
    direction: input
    description: AWS credentials file containing the access key and secret key for accessing the S3 bucket
  - type: string
    name: --aws_profile
    required: true
    direction: input
    description: AWS profile to use for accessing the S3 bucket.
resources:
  - type: bash_script
    path: script.sh
engines:
  - type: native
  - type: docker
    image: amazon/aws-cli:latest
runners:
  - type: executable
